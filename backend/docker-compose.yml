# Docker Compose for local development and testing
#
# Usage:
#   docker-compose up --build
#   docker-compose run --rm backend python test_local.py --sim-only

version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: circuitvision-backend
    volumes:
      # Mount models directory if you have pre-downloaded models
      # - ./CircuitVision/models:/app/CircuitVision/models:ro
      # Mount test images
      - ./test_images:/app/test_images:ro
      # Mount output directory
      - ./test_output:/app/test_output
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEBUG=1
    # For local testing, run the test script
    command: python test_local.py --sim-only
    # Uncomment to keep container running for debugging
    # command: tail -f /dev/null

  # Optional: Local API server for testing Flutter app
  api-server:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: circuitvision-api
    ports:
      - "8000:8000"
    volumes:
      - ./CircuitVision/models:/app/CircuitVision/models:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    # Run a simple HTTP server for local testing
    command: python -c "
      import json
      from http.server import HTTPServer, BaseHTTPRequestHandler
      from handler import handler
      import base64

      class Handler(BaseHTTPRequestHandler):
          def do_POST(self):
              content_length = int(self.headers['Content-Length'])
              body = self.rfile.read(content_length)
              job = json.loads(body)
              result = handler(job)
              self.send_response(200)
              self.send_header('Content-Type', 'application/json')
              self.end_headers()
              self.wfile.write(json.dumps(result).encode())

          def do_GET(self):
              self.send_response(200)
              self.send_header('Content-Type', 'application/json')
              self.end_headers()
              self.wfile.write(json.dumps({'status': 'ok'}).encode())

      print('Starting server on port 8000...')
      HTTPServer(('0.0.0.0', 8000), Handler).serve_forever()
      "
