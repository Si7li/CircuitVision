name: circuit_vision_app
description: CircuitVision - AI-powered circuit schematic analysis

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  provider: ^6.1.1
  
  # Networking
  http: ^1.1.2
  
  # Image handling
  image_picker: ^1.0.4
  
  # Utilities
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  
  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
